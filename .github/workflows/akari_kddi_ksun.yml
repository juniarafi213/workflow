name: AKARI KDDI KSUN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      CODENAME: akari_kddi
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      KERNEL_VER: LTS
      KERNEL_BRANCH: port/mglru-4.9
      KERNEL_URL: https://github.com/juniarafi213/stardust_kernel_sony_sdm845
      ANYKERNEL_URL: https://github.com/Sorayukii/AnyKernel3
      CLANG_URL: https://gitlab.com/kei-space/clang/r547379.git
      CLANG_BRANCH: master
      KSU_REPO: https://github.com/Sorayukii/KernelSU-Next.git
      KSU_REF: 40f7251dc7c2cd52a2dd12c3f04d661a1354bcae

    steps:
    - name: Checkout workflow repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison ca-certificates curl flex gcc git libc6-dev libssl-dev \
          openssl python-is-python3 ssh wget zip sudo make clang \
          gcc-arm-linux-gnueabi software-properties-common build-essential \
          libarchive-tools gcc-aarch64-linux-gnu libssl-dev libffi-dev \
          libncurses5-dev zlib1g zlib1g-dev libreadline-dev libbz2-dev \
          libsqlite3-dev make gcc pigz python3 cpio lld

    - name: Setup github account
      run: |
        git config --global user.name "juniarafi213"
        git config --global user.email "juniarafi506@gmail.com"

    - name: Clone kernel source
      run: |
        git clone "$KERNEL_URL" -b "$KERNEL_BRANCH" kernel
        cd kernel
        echo "KERNEL_DIR=$(pwd)" >> "$GITHUB_ENV"

    - name: Clone AnyKernel3
      run: |
        cd "$KERNEL_DIR"
        git clone --depth=1 -b "$CODENAME" "$ANYKERNEL_URL" AnyKernel3
        echo "ANYKERNEL_DIR=$KERNEL_DIR/AnyKernel3" >> "$GITHUB_ENV"

    - name: Clone clang
      run: |
        cd "$KERNEL_DIR"
        git clone --depth=1 "$CLANG_URL" clang
        echo "CLANG_DIR=$KERNEL_DIR/clang" >> "$GITHUB_ENV"

    - name: Set up KernelSU Next (pinned hookless staging)
      run: |
        set -euo pipefail
        cd "$KERNEL_DIR"

        git clone --filter=blob:none "$KSU_REPO" KernelSU-Next
        git -C KernelSU-Next checkout --detach "$KSU_REF"
        test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSU_REF"

        KSU_SOURCE="$KERNEL_DIR/KernelSU-Next/kernel"
        KERNEL_DRIVERS="$KERNEL_DIR/drivers"

        test -f "$KSU_SOURCE/Kconfig"
        test -f "$KSU_SOURCE/Makefile"
        test -f "$KERNEL_DRIVERS/Makefile"
        test -f "$KERNEL_DRIVERS/Kconfig"

        ln -sfn \
          "$(realpath --relative-to="$KERNEL_DRIVERS" "$KSU_SOURCE")" \
          "$KERNEL_DRIVERS/kernelsu"

        grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' "$KERNEL_DRIVERS/Makefile" || \
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$KERNEL_DRIVERS/Makefile"

        grep -qF 'source "drivers/kernelsu/Kconfig"' "$KERNEL_DRIVERS/Kconfig" || \
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "$KERNEL_DRIVERS/Kconfig"

        echo "=== Pinned KernelSU Next source ==="
        git -C KernelSU-Next rev-parse HEAD
        git -C KernelSU-Next log -1 --oneline

    - name: Generate defconfig
      run: |
        set -euo pipefail
        cd "$KERNEL_DIR"
        CONFIG_NAME="tama_${CODENAME}_defconfig"
        DEFCONFIG_PATH="arch/arm64/configs/$CONFIG_NAME"

        test -f "$DEFCONFIG_PATH"

        sed -i '/^CONFIG_KSU=/d' "$DEFCONFIG_PATH"
        sed -i '/^CONFIG_KSU_EXTRAS=/d' "$DEFCONFIG_PATH"
        sed -i '/^CONFIG_KSU_TAMPER_SYSCALL_TABLE=/d' "$DEFCONFIG_PATH"
        sed -i '/^CONFIG_KSU_KPROBES_KSUD=/d' "$DEFCONFIG_PATH"
        sed -i '/^CONFIG_KPROBES=/d' "$DEFCONFIG_PATH"
        sed -i '/^CONFIG_KRETPROBES=/d' "$DEFCONFIG_PATH"

        {
          printf '%s\n' 'CONFIG_KSU=y'
          printf '%s\n' 'CONFIG_KSU_TAMPER_SYSCALL_TABLE=y'
          printf '%s\n' 'CONFIG_KSU_KPROBES_KSUD=y'
          printf '%s\n' 'CONFIG_KPROBES=y'
          printf '%s\n' 'CONFIG_KRETPROBES=y'
        } >> "$DEFCONFIG_PATH"

        sed -i "s/CONFIG_LOCALVERSION=\"-Stardust\"/CONFIG_LOCALVERSION=\"-$KERNEL_VER\"/" "$DEFCONFIG_PATH"
        sed -i "s/^CONFIG_WORKINGSET_PROTECTION=.*/CONFIG_WORKINGSET_PROTECTION=n/" "$DEFCONFIG_PATH"
        # sed -i "s/^CONFIG_AUDIT=.*/CONFIG_AUDIT=n/" "$DEFCONFIG_PATH"

        rm -rf out
        make O=out ARCH=arm64 "$CONFIG_NAME"

        echo "=== Resolved KernelSU configuration ==="
        grep -E \
          '^(CONFIG_KSU|CONFIG_KSU_TAMPER_SYSCALL_TABLE|CONFIG_KSU_KPROBES_KSUD|CONFIG_KPROBES|CONFIG_KRETPROBES)=' \
          out/.config

        cp out/.config "$DEFCONFIG_PATH"

    - name: Build kernel
      run: |
        set -o pipefail

        escape_markdown_v2() {
          echo "$1" | sed \
            -e 's/\\/\\\\/g' -e 's/_/\\_/g' -e 's/\*/\\*/g' \
            -e 's/\[/\\[/g' -e 's/\]/\\]/g' -e 's/(/\\(/g' \
            -e 's/)/\\)/g' -e 's/~/\\~/g' -e 's/`/\\`/g' \
            -e 's/>/\\>/g' -e 's/#/\\#/g' -e 's/+/\\+/g' \
            -e 's/-/\\-/g' -e 's/=/\\=/g' -e 's/|/\\|/g' \
            -e 's/{/\\{/g' -e 's/}/\\}/g'
        }

        send_telegram_message() {
          local message="$1"
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "text=$message"
        }

        send_telegram_file() {
          local file_path="$1"
          local file_name
          local escaped_name
          local caption

          file_name=$(basename "$file_path")
          escaped_name=$(escape_markdown_v2 "$file_name")
          caption="\`$escaped_name\`"

          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" \
            -F "chat_id=$CHAT_ID" \
            -F "document=@$file_path" \
            -F "caption=$caption" \
            -F "parse_mode=MarkdownV2"
        }

        cd "$KERNEL_DIR"
        LOG_FILE="$KERNEL_DIR/build.log"
        OUT_DIR="$KERNEL_DIR/out"
        KERNEL_IMAGE="$OUT_DIR/arch/arm64/boot/Image.gz-dtb"
        CONFIG_NAME="tama_${CODENAME}_defconfig"
        KERNEL_COMMIT_ID=$(git rev-parse --short=7 HEAD)
        ZIP_NAME="${KERNEL_VER}_${CODENAME}-KSUN-$(date +%Y%m%d)-${KERNEL_COMMIT_ID}.zip"

        echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
        echo "LOG_FILE=$LOG_FILE" >> "$GITHUB_ENV"

        send_telegram_message "🔨 Starting kernel compilation for $CODENAME on branch $KERNEL_BRANCH"

        export KBUILD_BUILD_USER=ivy
        export KBUILD_BUILD_HOST="$KERNEL_COMMIT_ID"
        export PATH="$CLANG_DIR/bin:$PATH"

        make O="$OUT_DIR" ARCH=arm64 "$CONFIG_NAME"
        make -j"$(nproc --all)" O="$OUT_DIR" ARCH=arm64 \
          CC=clang LD=ld.lld AR=llvm-ar AS=llvm-as NM=llvm-nm \
          OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
          CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          2>&1 | tee -a "$LOG_FILE"

        BUILD_RESULT=${PIPESTATUS[0]}
        if [ "$BUILD_RESULT" -ne 0 ]; then
          send_telegram_message "❌ Compilation failed!"
          [ -f "$LOG_FILE" ] && send_telegram_file "$LOG_FILE"
          exit 1
        fi

        test -s "$KERNEL_IMAGE"
        cp "$KERNEL_IMAGE" "$ANYKERNEL_DIR/Image.gz-dtb"

        cd "$ANYKERNEL_DIR"
        zip -r9 "../$ZIP_NAME" ./* > /dev/null

        cd "$KERNEL_DIR"
        send_telegram_file "$ZIP_NAME"
        send_telegram_file "$LOG_FILE"
        send_telegram_message "✅ Compilation completed, Flashable zip is ready"

    - name: Upload kernel zip artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.KERNEL_DIR }}/${{ env.ZIP_NAME }}

    - name: Upload build log artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: ${{ env.LOG_FILE }}
